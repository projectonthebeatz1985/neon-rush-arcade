<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b1d">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><title>Neon Rush Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#080b1d;color:white;font-family:system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}.shell{width:min(96vw,530px);position:relative}.heading{text-align:center;font-size:clamp(25px,6vw,38px);font-weight:1000;letter-spacing:3px;text-shadow:0 0 18px #ff32bd;margin:8px 0}.heading span{color:#31f5ff}.stats{display:flex;justify-content:space-around;padding:10px;background:#171d39;border:1px solid #384776;border-radius:14px 14px 0 0;font-weight:800}.stats b{color:#ffe55b}canvas{width:100%;height:auto;display:block;background:#080c21;border:2px solid #3d4c84;touch-action:none}.bottom{display:flex;gap:12px;justify-content:center;align-items:center;padding:10px}.bottom button,.overlay button{background:linear-gradient(135deg,#ff3ab6,#763eff);color:white;border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 0 15px #a631ff66}.bottom button{min-width:100px}.bottom button:active,.overlay button:active{transform:scale(.96)}.overlay{position:absolute;inset:65px 2px 65px;background:#070b20dd;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:22px;z-index:5}.overlay h2{font-size:38px;margin:0 0 12px;color:#fff;text-shadow:0 0 22px #ff3ab6}.overlay p{max-width:370px;line-height:1.6;color:#d5defd}.overlay small{margin-top:16px;color:#91a5d6}.hidden{display:none}.note{text-align:center;color:#a9b5d9;font-size:12px;margin:0 0 8px}@media (min-width:700px){.bottom button{padding:9px 20px}}</style></head><body><div class="shell"><div class="heading">⚡ NEON <span>RUSH</span> ⚡</div><div class="stats"><div>⭐ SCORE <b id="score">0</b></div><div>🏆 BEST <b id="best">0</b></div><div>❤️ <b id="lives">3</b></div><div>🚀 LV <b id="level">1</b></div></div><canvas id="game" width="480" height="600"></canvas><div class="bottom"><button id="left">◀ LEFT</button><button id="pause">⏸ PAUSE</button><button id="right">RIGHT ▶</button><button id="mute">🔊</button></div><p class="note">Move with ← → or A/D, touch buttons, or drag. Press P to pause.</p><div class="overlay" id="overlay"><h2 id="title">NEON RUSH</h2><p id="message">Dodge the red hazards, grab golden coins, and collect blue shields and green hearts! Survive as long as you can.</p><button id="start">▶ PLAY NOW</button><small>Fast rounds • Endless levels • Local high scores</small></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,$=id=>document.getElementById(id);let state='menu',score=0,lives=3,level=1,best=0,player={x:240,y:520,r:17,shield:0,inv:0},objects=[],particles=[],stars=[],time=0,spawn=0,last=0,keys={},pointer=null,mute=false,audio=null;try{best=Number(localStorage.getItem('neonrush-best')||0)}catch(e){}$('best').textContent=best;for(let i=0;i<75;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,s:Math.random()*1.8+.5});function beep(freq=440,duration=.1,type='sine',vol=.06){if(mute)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function updateUI(){$('score').textContent=Math.floor(score);$('best').textContent=best;$('lives').textContent=lives;$('level').textContent=level}function start(){state='play';score=0;lives=3;level=1;objects=[];particles=[];time=0;spawn=0;player={x:240,y:520,r:17,shield:0,inv:0};$('overlay').classList.add('hidden');$('pause').textContent='⏸ PAUSE';updateUI();beep(600,.16)}function end(){state='over';let n=Math.floor(score);if(n>best){best=n;try{localStorage.setItem('neonrush-best',best)}catch(e){}}updateUI();$('title').textContent='GAME OVER';$('message').innerHTML=`You scored <b style="color:#ffe55b">${n}</b> points and reached level ${level}. ${n===best?'🏆 NEW HIGH SCORE!':'Try again and beat your best!'}`;$('start').textContent='↻ PLAY AGAIN';$('overlay').classList.remove('hidden');beep(160,.35,'sawtooth')}function toggle(){if(state==='play'){state='pause';$('title').textContent='PAUSED';$('message').textContent='Ready to jump back into the action?';$('start').textContent='▶ RESUME';$('overlay').classList.remove('hidden');$('pause').textContent='▶ RESUME'}else if(state==='pause'){state='play';$('overlay').classList.add('hidden');$('pause').textContent='⏸ PAUSE'}}function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=Math.random()*4+1;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25+Math.random()*15,color})}}function addObject(){let r=Math.random(),type=r<.65?'hazard':r<.88?'coin':r<.95?'shield':'heart';objects.push({x:24+Math.random()*(W-48),y:-30,r:type==='hazard'?17+Math.random()*8:15,type,spin:Math.random()*6.28})}function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(){ctx.fillStyle='#080c21';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#182b53';ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(time*2)%48;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let s of stars){ctx.globalAlpha=.3+.3*Math.sin(time*.03+s.x);ctx.fillStyle='#8ecaff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);ctx.shadowBlur=20;ctx.shadowColor=o.type==='hazard'?'#ff385c':o.type==='coin'?'#ffdb42':o.type==='shield'?'#35e5ff':'#56ff8a';ctx.fillStyle=ctx.shadowColor;ctx.strokeStyle='#fff';ctx.lineWidth=2;if(o.type==='hazard'){ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,rr=i%2?o.r*.7:o.r*1.15;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#4b0b25';ctx.fillRect(-5,-5,10,10)}else if(o.type==='coin'){ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#9b5900';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1)}else if(o.type==='shield'){ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#073d62';ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('◆',0,1)}else{ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#06502d';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',0,1)}ctx.restore()}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(!(player.inv>0&&Math.floor(time/5)%2===0)){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor=player.shield>0?'#36efff':'#e43cff';ctx.shadowBlur=24;ctx.fillStyle='#e83bff';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(20,17);ctx.lineTo(0,9);ctx.lineTo(-20,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#6fffff';ctx.fillRect(-5,0,10,9);if(player.shield>0){ctx.strokeStyle='#35eaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.stroke()}ctx.restore()}if(player.shield>0){ctx.fillStyle='#4df3ff';ctx.font='bold 15px sans-serif';ctx.fillText('🛡 SHIELD '+Math.ceil(player.shield/60)+'s',15,28)}}function tick(ts){let dt=Math.min((ts-last)/16.667||1,2);last=ts;if(state==='play'){time+=dt;level=1+Math.floor(score/150);score+=dt*.15*(1+level*.12);let speed=(2.7+level*.45)*dt;if(keys.ArrowLeft||keys.a||keys.A)player.x-=6.5*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=6.5*dt;if(pointer!==null)player.x+=(pointer-player.x)*Math.min(.24*dt,1);player.x=Math.max(23,Math.min(W-23,player.x));if(player.shield>0)player.shield-=dt;if(player.inv>0)player.inv-=dt;spawn+=dt;if(spawn>Math.max(15,45-level*2)){spawn=0;addObject()}for(let o of objects){o.y+=speed*(o.type==='hazard'?1.18:1);o.spin+=.03*dt;if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r-5){o.y=H+100;if(o.type==='hazard'){if(player.shield>0){player.shield=0;burst(o.x,player.y,'#3aeaff');beep(200,.2)}else if(player.inv<=0){lives--;player.inv=85;burst(player.x,player.y,'#ff4768',25);beep(130,.2,'sawtooth');if(lives<=0){end();break}}}else if(o.type==='coin'){score+=25;burst(o.x,player.y,'#ffe04e');beep(800,.09);setTimeout(()=>beep(1050,.09),60)}else if(o.type==='shield'){player.shield=360;burst(o.x,player.y,'#3aeaff');beep(620,.3)}else{lives=Math.min(5,lives+1);burst(o.x,player.y,'#64ff8a');beep(920,.2)}}}objects=objects.filter(o=>o.y<H+40);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);updateUI()}draw();requestAnimationFrame(tick)}$('start').addEventListener('click',()=>state==='pause'?toggle():start());$('pause').addEventListener('click',()=>{if(state==='play'||state==='pause')toggle()});$('mute').addEventListener('click',()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='p'&&!e.repeat)toggle();if(e.key===' '&&state==='menu')start()});window.addEventListener('keyup',e=>{keys[e.key]=false});function bind(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>keys[key]=false);el.addEventListener('pointercancel',()=>keys[key]=false)}bind('left','ArrowLeft');bind('right','ArrowRight');c.addEventListener('pointerdown',e=>{pointer=(e.clientX-c.getBoundingClientRect().left)/c.getBoundingClientRect().width*W;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(pointer!==null)pointer=(e.clientX-c.getBoundingClientRect().left)/c.getBoundingClientRect().width*W});c.addEventListener('pointerup',()=>pointer=null);c.addEventListener('pointercancel',()=>pointer=null);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')toggle()});requestAnimationFrame(tick)})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
